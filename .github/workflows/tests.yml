name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both Ubuntu LTS releases are pinned deliberately, because they ship
        # different libuv versions and therefore exercise different code:
        #
        #   24.04 -> libuv 1.48, no UV_TCP_REUSEPORT -> shared listening socket
        #   26.04 -> libuv 1.51, has it             -> one socket per worker
        #
        # `ubuntu-latest` would cover exactly one of those, and would silently
        # switch which one when GitHub moves the alias -- taking the other path
        # out of CI without anyone noticing. That is not hypothetical: the
        # shared-socket path exists because libuv 1.48 has no flag to pass, and
        # 24.04 is the LTS most production deployments are on.
        os: [ubuntu-24.04, ubuntu-26.04, macos-latest]
        python-version: ["3.12"]
        include:
          # The libuv path does not vary with the Python version, so the full
          # interpreter sweep runs on one OS rather than nine times over.
          - os: ubuntu-24.04
            python-version: "3.10"
          - os: ubuntu-24.04
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.13"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libuv1-dev libssl-dev

      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: brew install libuv openssl@3

      - name: Install freastal + test deps
        # setuptools is a build-system requirement, not a runtime one, and
        # 3.12+ environments do not preinstall it; tests/test_build_deps.py
        # imports setup.py, so ask for it explicitly.
        run: pip install -e . pytest httpx setuptools

      # Which of the two worker-binding paths did this job actually exercise?
      # It is decided by the libuv the runner happens to ship, so a job name
      # cannot say it and a reader of a red build should not have to guess.
      - name: Report libuv and the path under test
        run: |
          python - <<'EOF'
          from freastal import _freastal as f
          v = f.libuv_version
          probe = f.reuse_port_supported()
          print(f"libuv {v}")
          print(f"UV_TCP_REUSEPORT compiled in : {bool(getattr(f, 'HAS_REUSE_PORT', 0))}")
          print(f"honoured at runtime          : {probe}")
          print(
              "worker binding path          : "
              + ("one socket per worker (SO_REUSEPORT)" if probe
                 else "one shared listening socket")
          )
          EOF

      - name: Run tests
        run: python -m pytest tests/ -v

  no-tls:
    name: Build without OpenSSL
    runs-on: ubuntu-latest
    # Job-level, not per-step: the build needs it to omit TLS, and the tests
    # need it to know the omission was deliberate rather than a TLS build that
    # has quietly lost its OpenSSL.
    env:
      FREASTAL_NO_TLS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system deps
        run: sudo apt-get install -y libuv1-dev
      # A wheel built where OpenSSL headers are missing has no TLS, and used to
      # accept a certfile and serve the port in plaintext anyway.  Nothing that
      # can build TLS produces that configuration by accident, so it went
      # untested; FREASTAL_NO_TLS forces it.
      - name: Install freastal without TLS
        run: pip install -e . pytest httpx
      - name: TLS is genuinely absent from this build
        run: python -c "import freastal; assert freastal.has_tls is False"
      - name: A certfile is refused, not silently downgraded
        run: python -m pytest tests/test_silent_fallbacks.py -v -k "not tls_less"
