name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned: an unpinned ruff changes its formatting expectations on every
      # release, which repeatedly turned lint red on unrelated PRs.
      - run: pip install ruff==0.16.5
      - run: ruff format --check .
      - run: ruff check .
